<!DOCTYPE html>
<html lang="ko">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>저장값 초기화 (임시)</title></head>
<body style="font-family:-apple-system,sans-serif;padding:24px;line-height:1.6">
<p>이 브라우저에 저장된 신혼여행 견적 페이지 설정을 지우고 페이지로 돌아갑니다.</p>
<p id="msg">…</p>
<script>
try{
  ['honeymoon_opts_v3','honeymoon_s2_v1','honeymoon_s3_v1','honeymoon_tab'].forEach(function(k){ localStorage.removeItem(k); });
  document.getElementById('msg').textContent = '저장값을 지웠습니다.';
}catch(e){ document.getElementById('msg').textContent = 'storage 오류: '+e; }
setTimeout(function(){ location.replace('./'); }, 1200);
</script>
</body>
</html>
